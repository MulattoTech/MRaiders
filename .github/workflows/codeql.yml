name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '32 6 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  analyze-cpp:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev
      - uses: github/codeql-action/init@v3
        with:
          languages: cpp
          build-mode: manual
      - run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - uses: github/codeql-action/analyze@v3
