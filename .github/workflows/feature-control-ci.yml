name: Feature Control
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Feature Control tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Audit and guided-intake unit tests
        run: python -m unittest discover -s tests -p 'test_feature_control.py' -v
      - name: MR-15 dependency planning and HTTP endpoint tests
        run: python -m unittest discover -s tests -p 'test_orchestration.py' -v
      - name: Python compiler sanity
        run: python -m compileall -q tools
      - name: Javascript GUI syntax
        run: node --check tools/feature_control/static/app.js
